<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cicada — L'outil de gestion des plans de gestion des aires protégées</title>
    <meta
      name="description"
      content="Cicada centralise la rédaction, le suivi et l'évaluation des plans de gestion des espaces naturels protégés. Projet libre porté par la Fédération des Conservatoires d'espaces naturels et Réserves naturelles de France, cofinancé par l'Union européenne (LIFE BIODIV'FRANCE)."
    />
    <meta name="theme-color" content="#025359" />

    <!-- Open Graph / partage -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Cicada" />
    <meta
      property="og:title"
      content="Cicada — L'outil de gestion des plans de gestion des aires protégées"
    />
    <meta
      property="og:description"
      content="Rédiger, suivre et évaluer les plans de gestion des espaces naturels protégés. Logiciel libre, auto-hébergeable ou proposé en service hébergé."
    />
    <!-- Image de partage : la photo ne figure plus sur la page, mais une
         vignette reste nécessaire pour les aperçus sur les réseaux et les
         messageries, où un logo sur fond transparent rendrait mal. -->
    <meta property="og:image" content="/assets/images/hero-cicada.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/images/logo-cicada-icon-2026.svg" />

    <!-- Nunito : police du Kit UI Biodiv' (identique à l'application Cicada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Uicons by Flaticon — Rounded Regular (jeu d'icônes de l'application) -->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
  </head>

    <app-root></app-root>
  </body>
</html>
